name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v6
        with: { node-version: "22.x", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18.x", "20.x", "22.x"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --check index.js
      - run: npm test
      - run: npm run release:check

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: "22.x", cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm run smoke:list-tools
      - run: npm run smoke:packed

  live-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with: { node-version: "22.x", cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Verify public carrier endpoint shape
        run: node scripts/smoke-public-api.mjs

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --prefix worker --no-audit --no-fund
      - run: npm audit --prefix worker --omit=dev --audit-level=high
      - run: npm test --prefix worker
